apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-app
  template:
    metadata:
      labels:
        app: k8s-app
    spec:
      containers:
        - name: container1
          image: us-central1-docker.pkg.dev/k8s-assignment-453321/k8s-repo/container1:latest
          ports:
            - containerPort: 6000
          volumeMounts:
            - mountPath: "/Archie_PV_dir/"
              name: storage
        - name: container2
          image: us-central1-docker.pkg.dev/k8s-assignment-453321/k8s-repo/container2:latest
          ports:
            - containerPort: 7000
          volumeMounts:
            - mountPath: "/Archie_PV_dir/"
              name: storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: k8s-pvc


---
apiVersion: v1
kind: Service
metadata:
  name: k8s-service
spec:
  selector:
    app: k8s-app
  ports:
    - name: container1
      protocol: TCP
      port: 80
      targetPort: 6000
    - name: container2
      protocol: TCP
      port: 81
      targetPort: 7000
  type: LoadBalancer
